<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f5f4f2;font-family:Helvetica,Arial,sans-serif;color:#26262a;-webkit-font-smoothing:antialiased">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e6e5e2;border-radius:12px;overflow:hidden">
      <div style="padding:24px 28px;border-bottom:1px solid #e6e5e2">
        <a href="{{ .SiteURL }}" style="color:#26262a;font-size:15px;font-weight:600;letter-spacing:-0.01em;text-decoration:none">For the Dreamers</a>
      </div>
      <div style="padding:28px">
        <h1 style="margin:0 0 16px;font-size:20px;line-height:1.35;font-weight:600;letter-spacing:-0.01em">Your email address was changed</h1>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#5c5c63">The email on your For the Dreamers account was changed to <strong style="color:#26262a">{{ .Email }}</strong>. Use this address to sign in from now on.</p>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#8a8a92">If this wasn't you, contact support immediately.</p>
      </div>
      <div style="padding:20px 28px;border-top:1px solid #e6e5e2;font-size:12px;line-height:1.6;color:#8a8a92">
        A modern marketplace for independent dreamers and makers.
      </div>
    </div>
  </body>
</html>
